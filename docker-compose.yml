# The whole BeBe app in Docker: database, API and frontend.
# Start:  docker compose up --build   (from the repository root)
# Stop:   docker compose down
# See README.md, "Run the full project with Docker".
name: bebe

include:
  # The database, defined once and shared with the backend's development setup
  - backend/docker-compose.yml

services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3333
      HOST: 0.0.0.0
      LOG_LEVEL: info
      # No key is stored in the repository. When APP_KEY is not set (in a .env file
      # next to this one, or in the terminal), the container creates a random key
      # every time it starts; see backend/Dockerfile.
      APP_KEY: ${APP_KEY:-}
      APP_URL: http://localhost:3333
      SESSION_DRIVER: cookie
      # Inside Docker the API reaches the database by its service name and internal port
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: bebe
      DB_PASSWORD: bebe
      DB_DATABASE: bebe
    ports:
      - '3333:3333'
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./quasar-project
    restart: unless-stopped
    environment:
      QCLI_API_URL: http://localhost:3333/api/v1
    ports:
      - '9000:9000'
    depends_on:
      - backend
