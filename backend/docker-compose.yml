# Local development database for BeBe.
# Start:  docker compose up -d     (from the backend/ folder)
# Stop:   docker compose down      (data is kept in the "bebe-pgdata" volume)
# Reset:  docker compose down -v   (deletes all data)
#
# The docker-compose.yml in the repository root includes this file, so the
# full Docker setup and the local development setup use the same database.
# The shared project name makes both commands manage the same container.
name: bebe

services:
  db:
    image: postgres:17-alpine
    container_name: bebe-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bebe
      POSTGRES_PASSWORD: bebe
      POSTGRES_DB: bebe
    ports:
      # 5433 on the host, so it doesn't clash with a locally installed PostgreSQL on 5432.
      # Docker Compose reads DB_PORT from backend/.env, so if 5433 is taken too, change DB_PORT there.
      - '${DB_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the extra "bebe_test" database on first start
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bebe -d bebe']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
    # A fixed name, so it is the same volume whichever folder Compose is started from
    name: bebe-pgdata
